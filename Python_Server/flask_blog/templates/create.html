{% extends 'base.html' %}

{% block content %}
<h1>{% block title %} Create a New Hotel Booking {% endblock %}</h1>

<form method="post">
    <div class="form-group">
        <label for="title">Hotel Name</label>
        <input type="text" name="title"
               placeholder="Post title" class="form-control"
               value="{{ request.form['Hotel Name'] }}"></input>
    </div>

    <div class="form-group">
        <label for="content">Length of Booking</label>
        <input id="time" type="number" value="0"
                  class="form-control">{{ request.form['Length of Booking'] }}</input>
    </div>
    <div class="form-group">
        <button type="submit" class="btn btn-primary">Submit</button>
    </div>
</form>
{% endblock %}
